# Genera en línea la voz de SimiAru con los modelos MMS de Meta. Corre en GitHub, contra Neon y Cloudinary.
# Se lanza a mano: Actions → "Audio MMS" → Run workflow.
#   prueba: 30 palabras por lengua para escuchar. Quedan como artefacto y no escribe en la base.
#   completo: aplica las migraciones, sube a Cloudinary, llena audios y vocabulario.audio_url, y actualiza el contenido del repositorio.
#   comparar: genera las "palabras" en los estilos A, B, C y D para escucharlas (artefacto). No escribe nada.
#   rehacer-cortas: vuelve a generar con el "estilo" elegido las palabras de hasta "letras" letras y las reemplaza en línea.
# Las voces grabadas no se tocan (ver tools/tts/generate_audio.py). Se puede repetir: continúa donde quedó.
# Secretos del repositorio: DATABASE_URL, CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET.
name: Audio MMS

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer"
        type: choice
        options: [prueba, completo, comparar, rehacer-cortas]
        default: prueba
      idiomas:
        description: "Lenguas separadas por espacios"
        default: "quechua aymara"
      palabras:
        description: "comparar: palabras separadas por comas"
        default: "ama,uma,ari,mama,maki,wasi,inti,yaku,huk,iskay,kimsa,tawa,pichqa,suqta,qanchis,pusaq,isqun,chunka"
      estilo:
        description: "rehacer-cortas: estilo elegido al comparar"
        type: choice
        options: [B, C, D, A]
        default: B
      letras:
        description: "rehacer-cortas: largo máximo de las palabras (letras)"
        default: "5"

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: mms-${{ hashFiles('languages/**/paquete.json', 'frontend/src/languages/*.json') }}
      - name: Dependencias
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r tools/tts/requirements.txt
          npm ci --prefix backend
      - name: Comprobar los secretos
        run: test -n "$DATABASE_URL" || { echo "Falta el secreto DATABASE_URL"; exit 1; }
      - name: Migraciones
        if: inputs.modo == 'completo'
        working-directory: backend
        run: npm run migrate
      - name: Lote de prueba
        if: inputs.modo == 'prueba'
        run: for i in ${{ inputs.idiomas }}; do python tools/tts/generate_audio.py --idioma "$i" --muestra 30; done
      - name: Comparar estilos
        if: inputs.modo == 'comparar'
        run: for i in ${{ inputs.idiomas }}; do python tools/tts/generate_audio.py --idioma "$i" --comparar "${{ inputs.palabras }}"; done
      - name: Rehacer las palabras cortas
        if: inputs.modo == 'rehacer-cortas'
        run: for i in ${{ inputs.idiomas }}; do python tools/tts/generate_audio.py --idioma "$i" --rehacer-cortas "${{ inputs.letras }}" --estilo "${{ inputs.estilo }}" --confirmar; done
      - name: Generación completa
        if: inputs.modo == 'completo'
        run: |
          node frontend/scripts/export-audio-texts.mjs textos.json
          for i in ${{ inputs.idiomas }}; do
            python tools/tts/generate_audio.py --idioma "$i" --todo --subir --confirmar --textos textos.json
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-${{ inputs.modo }}
          path: tools/tts/salida/
          if-no-files-found: ignore
      - name: Actualizar el contenido del repositorio
        if: inputs.modo == 'completo' || inputs.modo == 'rehacer-cortas'
        run: |
          npm run db:content --prefix backend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/seed/contenido.sql
          git diff --cached --quiet || { git commit -m "Contenido: audio MMS (${{ inputs.modo }}) en línea"; git push; }
